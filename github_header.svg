  <rect width="1280" height="360" fill="url(#glowA)"/>
  <rect width="1280" height="360" fill="url(#glowB)"/>
  <circle cx="1020" cy="90" r="120" fill="#22D3EE" fill-opacity="0.05"/>
  <circle cx="1120" cy="220" r="90" fill="#3B82F6" fill-opacity="0.06"/>

  <text x="72" y="128" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1">Muhammad Qasim Afzal</text>
  <text x="72" y="172" fill="#94A3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Senior Full-Stack Engineer · Healthcare systems &amp; SaaS</text>
  <rect x="72" y="196" width="200" height="2" rx="1" fill="url(#line)"/>

