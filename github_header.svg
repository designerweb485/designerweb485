<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Qasim Afzal</title>
  <desc id="desc">Senior Full-Stack Engineer ? healthcare systems and SaaS</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080C"/>
      <stop offset="45%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#07151A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="78%" cy="35%" r="42%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07080C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="18%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#07080C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22D3EE"/>
      <stop offset="80%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
