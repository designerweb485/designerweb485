name: Profile cards

on:
  schedule:
    # Daily 18:00 UTC (~11 PM PKT)
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "profile.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build profile cards

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install build deps
        run: pip install -r scripts/requirements.txt

      # PROFILE_TOKEN lifts rate limit + can include private contribs when
      # GitHub setting "Include private contributions on my profile" is on.
      - name: Build profile cards
        id: cards
        run: python scripts/build.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md scripts/state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update profile cards"
          git push

      - name: Fail when card build failed
        if: steps.cards.outcome == 'failure'
        run: |
          echo "build.py failed — check contribution calendar or API rate limits"
          exit 1
